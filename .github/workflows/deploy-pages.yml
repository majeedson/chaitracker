name: Deploy ChaiTracker staging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check Credits phone layouts
        run: node tests/browser/credits-layout.mjs
      - name: Check Purchases and Orders phone layouts
        run: node tests/browser/vendor-purchases-layout.mjs
      - name: Check Cigarettes phone layouts
        run: node tests/browser/cigarettes-layout.mjs
      - run: npm run check:release
      - name: Require matching database before publishing
        if: github.event_name != 'pull_request'
        run: npm run check:database
        env:
          VITE_SUPABASE_URL: https://vfplweiufinrcasuntgn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5j3rxmlGUbsllKoSInzkGQ_qQ41k-Ba
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://vfplweiufinrcasuntgn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5j3rxmlGUbsllKoSInzkGQ_qQ41k-Ba
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
